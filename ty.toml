[environment]
extra-paths = ["./gguf-py", "./examples/model-conversion/scripts", "./tools/server/tests", "./scripts/snapdragon/qdc/tests"]
python-version = "3.10"

[rules]
deprecated = "warn"

[src]
exclude = [
    "./tools/mtmd/legacy-models/**",
]

[[overrides]]
include = [
    "./tools/server/tests/**",
    "./scripts/snapdragon/qdc/**",
    # tools/kokoro tooling imports the upstream `kokoro` Python package
    # for reference-activation dumping; that package isn't in CI, so the
    # type-checker can't resolve it. It runs only against an installed
    # kokoro env, not under CI.
    "./tools/kokoro/tools/**",
    # tools/misaki-g2p reference/table generators import the pinned Python
    # misaki, spaCy, phonemizer-fork, espeakng-loader and num2words; they run
    # only in that pinned env (see tools/misaki-g2p/README.md), not under CI.
    "./tools/misaki-g2p/scripts/**",
    "./tools/misaki-g2p/tests/**",
    # Paradee reference tools run in their pinned Python environment.
    "./tools/paradee/tools/**",
    # The ONNX converter imports onnx, which only that pinned env installs.
    "./tools/paradee/convert_paradee_onnx_to_gguf.py",
    # Same for the Parakeet reference dumper and bench scorer (torch,
    # transformers, soundfile, librosa and whisper_normalizer live in the
    # pinned reference env, see tools/parakeet/pins.json).
    "./tools/parakeet/tools/**",
    # conversion/* defines mixins (e.g. _Qwen35MtpMixin) whose super()
    # chains resolve to attributes provided by the composed Model
    # subclasses in convert_hf_to_gguf.py. ty cannot see that
    # composition at the mixin level, so the super() calls and
    # base-class attributes (ftype, metadata) appear unresolved.
    "./conversion/**",
    "./tools/mtmd/tests/**",
]

[overrides.rules]
unresolved-reference = "ignore"
unresolved-import = "ignore"
unresolved-attribute = "ignore"

[[overrides]]
include = [
    "./examples/pydantic_models_to_grammar.py",
]

[overrides.rules]
unsupported-operator = "ignore"
not-subscriptable = "ignore"
