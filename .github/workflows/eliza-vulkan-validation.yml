  continuation-coverage:
    permissions:
      contents: read
      actions: read
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.continuation_wave || inputs.final_wave) }}
    needs: continuation-worker
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      FINAL_WAVE: ${{ inputs.final_wave }}
      BUILD_JSON: new/vulkan-continuation-worker-0/build.json
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 8
      - uses: actions/download-artifact@v4
        with:
          pattern: vulkan-continuation-worker-*
          path: new
      - name: Download pinned prior ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35477466317 -R elizaOS/llama.cpp -n vulkan-wave-worker-0 -n vulkan-wave-worker-1 -n vulkan-wave-worker-2 -n vulkan-wave-worker-3 -D prior
          gh run download 35479874156 -R elizaOS/llama.cpp -n vulkan-partition-347-diagnostic -D prior/diagnostic
          if [ "$FINAL_WAVE" = true ]; then
            gh run download 35480212444 -R elizaOS/llama.cpp -n vulkan-continuation-worker-0 -n vulkan-continuation-worker-1 -D prior/continuation
          fi
      - name: Independently verify disjoint original coverage
        run: |
