name: Eliza Vulkan Validation

# Eliza-specific Vulkan backend parity job. Distinct from upstream
# build-vulkan.yml: this one actually runs test-backend-ops on Vulkan
# (filtered to a reasonable subset for llvmpipe) and surfaces the
# PASS/FAIL counts as a build artifact so we can review Vulkan
# regressions before merging shader or kernel changes.
#
# Runs on llvmpipe (Mesa software rasterizer). For real-GPU validation,
# wire in a self-hosted runner with an NVIDIA/AMD/Intel GPU later and
# add it as a second job in this file.

on:
  workflow_dispatch:
    inputs:
      final_wave:
        description: Validate only the final five remaining partitions from the reviewed continuation ledger.
        type: boolean
        default: false
      continuation_wave:
        description: Execute only the 121 remaining partitions using preserved runtime and reviewed prior coverage.
        type: boolean
        default: false
      diagnostic_347:
        description: Diagnose only timed-out partition 347 using the preserved binary; not full coverage.
        type: boolean
        default: false
      coverage_wave:
        description: Run one bounded coverage wave; incomplete global coverage remains red.
        type: boolean
        default: false
      partition_pilot:
        description: Run only four bounded partition timing probes; this does not qualify the full suite.
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/eliza-vulkan-validation.yml'
      - 'ggml/src/ggml-vulkan/**'
      - 'ggml/include/**'
      - 'src/**'
      - 'tests/test-backend-ops.cpp'
      - 'tests/test-quantize-fns.cpp'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_LOG_COLORS: 0
  LLAMA_LOG_PREFIX: 1
  LLAMA_LOG_TIMESTAMPS: 1

jobs:
  ubuntu-vulkan-llvmpipe-validation:
    if: ${{ !inputs.coverage_wave && !inputs.diagnostic_347 && !inputs.continuation_wave && !inputs.final_wave }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 5

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: eliza-vulkan-validation-ubuntu-24
          evict-old-files: 1d
          save: ${{ github.event_name == 'push' }}

      - name: System dependencies
        run: |
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential mesa-vulkan-drivers vulkan-tools \
            libvulkan-dev glslang-tools spirv-tools \
            libssl-dev

      - name: Vulkan SDK
        id: vulkan_sdk_version
        run: |
          echo "VULKAN_SDK_VERSION=$(curl https://vulkan.lunarg.com/sdk/latest/linux.txt)" >> "$GITHUB_ENV"

      - name: Cache Vulkan SDK
        uses: actions/cache@v5
        id: cache-sdk
        with:
          path: ./vulkan_sdk
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-${{ runner.os }}

      - name: Install Vulkan SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: ./.github/actions/linux-setup-vulkan
        with:
          path: ./vulkan_sdk
          version: ${{ env.VULKAN_SDK_VERSION }}

      - name: Configure
        run: |
          source ./vulkan_sdk/setup-env.sh
          cmake -B build-vulkan \
            -DGGML_VULKAN=ON \
            -DGGML_METAL=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          source ./vulkan_sdk/setup-env.sh
          cmake --build build-vulkan -j "$(nproc)" \
            --target llama-cli llama-completion \
                     test-backend-ops test-quantize-fns

      - name: Confirm Vulkan device
        run: |
          source ./vulkan_sdk/setup-env.sh
          vulkaninfo --summary | head -40

      - name: test-quantize-fns (CPU; smoke for Eliza custom quants)
        run: |
          set -euo pipefail
          ./build-vulkan/bin/test-quantize-fns | tee /tmp/quantize-fns.log
          # Must mention the Eliza-divergent quant types.
          for t in qjl1_256 q4_polar tbq3_0 tbq4_0 tbq3_tcq; do
            grep -q "Testing $t" /tmp/quantize-fns.log \
              || (echo "MISSING quant: $t" && exit 1)
          done

      - name: Vulkan broad case accounting
        if: ${{ !inputs.partition_pilot }}
        env:
          GGML_VK_VISIBLE_DEVICES: '0'
          GGML_VK_DISABLE_F16: '1'
          GGML_VK_DISABLE_COOPMAT: '1'
        run: |
          source ./vulkan_sdk/setup-env.sh
          set -euo pipefail
          python3 scripts/ci-vulkan-partitions.py \
            --binary build-vulkan/bin/test-backend-ops \
            --output /tmp/vulkan-validation/broad \
            --mode full --lane broad

      - name: Vulkan custom case accounting
        if: ${{ !inputs.partition_pilot }}
        env:
          GGML_VK_VISIBLE_DEVICES: '0'
          GGML_VK_DISABLE_F16: '1'
          GGML_VK_DISABLE_COOPMAT: '1'
        run: |
          source ./vulkan_sdk/setup-env.sh
          set -euo pipefail
          python3 scripts/ci-vulkan-partitions.py \
            --binary build-vulkan/bin/test-backend-ops \
            --output /tmp/vulkan-validation/custom \
            --mode full --lane custom

      - name: Vulkan pilot case accounting
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.partition_pilot }}
        env:
          GGML_VK_VISIBLE_DEVICES: '0'
          GGML_VK_DISABLE_F16: '1'
          GGML_VK_DISABLE_COOPMAT: '1'
        run: |
          source ./vulkan_sdk/setup-env.sh
          set -euo pipefail
          python3 scripts/ci-vulkan-partitions.py \
            --binary build-vulkan/bin/test-backend-ops \
            --output /tmp/vulkan-validation/pilot \
            --mode pilot

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eliza-vulkan-validation-logs
          path: |
            /tmp/quantize-fns.log
            /tmp/vulkan-validation
          retention-days: 14

  build:
    permissions:
      contents: read
      actions: read
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage_wave && !inputs.diagnostic_347 && !inputs.continuation_wave && !inputs.final_wave }}
    env:
      GGML_VK_VISIBLE_DEVICES: '0'
      GGML_VK_DISABLE_F16: '1'
      GGML_VK_DISABLE_COOPMAT: '1'
      VULKAN_SDK_VERSION: '1.4.357.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5
      - name: Install fixed Vulkan driver
        run: |
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update -y
          sudo apt-get install -y build-essential mesa-vulkan-drivers=26.2.3~kisak1~n vulkan-tools libvulkan-dev glslang-tools spirv-tools libssl-dev
      - uses: actions/cache@v5
        id: sdk
        with:
          path: ./vulkan_sdk
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-${{ runner.os }}
      - if: steps.sdk.outputs.cache-hit != 'true'
        uses: ./.github/actions/linux-setup-vulkan
        with:
          path: ./vulkan_sdk
          version: ${{ env.VULKAN_SDK_VERSION }}
      - name: Build source and preserve toolchain
        run: |
          set -euo pipefail
          # The SDK setup script reads optional positional/environment variables.
          set +u
          source ./vulkan_sdk/setup-env.sh
          set -u
          cmake -B build-vulkan -DGGML_VULKAN=ON -DGGML_METAL=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-vulkan -j "$(nproc)" --target test-backend-ops
          mkdir -p wave-build
          cmake --version > wave-build/cmake-version.txt
          c++ --version > wave-build/compiler-version.txt
          dpkg-query -W > wave-build/packages.txt
          vulkaninfo --summary > wave-build/vulkaninfo.txt
      - name: Fetch exact prior evidence and bind remaining inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The SDK setup script reads optional positional/environment variables.
          set +u
          source ./vulkan_sdk/setup-env.sh
          set -u
          gh run download 35467120771 -R elizaOS/llama.cpp -n eliza-vulkan-validation-logs -D prior/pilot-hosted
          gh run download 35470223485 -R elizaOS/llama.cpp -n eliza-vulkan-validation-logs -D prior/subdivision-hosted
          python3 scripts/ci-vulkan-coverage-wave.py prepare --binary build-vulkan/bin/test-backend-ops --prior prior --output wave-build
          tar -czf wave-build/runtime.tar.gz -C build-vulkan bin
          sha256sum wave-build/runtime.tar.gz wave-build/build.json wave-build/*.txt > wave-build/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-wave-build
          path: wave-build
          retention-days: 14
  worker:
    env:
      GGML_VK_VISIBLE_DEVICES: '0'
      GGML_VK_DISABLE_F16: '1'
      GGML_VK_DISABLE_COOPMAT: '1'
      VULKAN_SDK_VERSION: '1.4.357.1'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 59
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - name: Install identical driver and loader prerequisites
        run: |
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update -y
          sudo apt-get install -y mesa-vulkan-drivers=26.2.3~kisak1~n vulkan-tools libvulkan-dev libssl-dev
      - uses: actions/cache@v5
        id: sdk
        with:
          path: ./vulkan_sdk
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-${{ runner.os }}
      - if: steps.sdk.outputs.cache-hit != 'true'
        uses: ./.github/actions/linux-setup-vulkan
        with:
          path: ./vulkan_sdk
          version: ${{ env.VULKAN_SDK_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: vulkan-wave-build
          path: wave-build
      - name: Verify runtime bytes and execute bounded queue
        run: |
          set -euo pipefail
          sha256sum -c wave-build/SHA256SUMS
          mkdir build-vulkan
          tar -xzf wave-build/runtime.tar.gz -C build-vulkan
          # The SDK setup script reads optional positional/environment variables.
          set +u
          source ./vulkan_sdk/setup-env.sh
          set -u
          python3 scripts/ci-vulkan-coverage-wave.py worker --binary build-vulkan/bin/test-backend-ops --build wave-build/build.json --worker ${{ matrix.worker }} --output worker-${{ matrix.worker }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-wave-worker-${{ matrix.worker }}
          path: worker-${{ matrix.worker }}
          retention-days: 14
  coverage:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.coverage_wave && !inputs.diagnostic_347 && !inputs.continuation_wave && !inputs.final_wave }}
    needs: [build, worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: vulkan-wave-build
          path: wave-build
      - uses: actions/download-artifact@v4
        with:
          pattern: vulkan-wave-worker-*
          path: wave-workers
      - name: Independently reject incomplete original coverage
        run: |
          set -euo pipefail
          mkdir receipts
          for i in 0 1 2 3; do
            if [ -d "wave-workers/vulkan-wave-worker-$i" ]; then
              mv "wave-workers/vulkan-wave-worker-$i" "receipts/worker-$i"
            fi
          done
          python3 scripts/ci-vulkan-coverage-wave.py aggregate --build wave-build/build.json --receipts receipts --output coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-wave-coverage
          path: coverage.json
          retention-days: 14

  diagnostic-347:
    permissions:
      contents: read
      actions: read
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_347 && !inputs.continuation_wave && !inputs.final_wave }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GGML_VK_VISIBLE_DEVICES: '0'
      GGML_VK_DISABLE_F16: '1'
      GGML_VK_DISABLE_COOPMAT: '1'
      VULKAN_SDK_VERSION: '1.4.357.1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 6
      - name: Require the isolated diagnostic mode
        env:
          COVERAGE_WAVE: ${{ inputs.coverage_wave }}
          PARTITION_PILOT: ${{ inputs.partition_pilot }}
        run: test "$COVERAGE_WAVE" != true && test "$PARTITION_PILOT" != true
      - name: Install identical driver and loader prerequisites
        run: |
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update -y
          sudo apt-get install -y mesa-vulkan-drivers=26.2.3~kisak1~n vulkan-tools libvulkan-dev libssl-dev
      - uses: actions/cache@v5
        id: sdk
        with:
          path: ./vulkan_sdk
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-${{ runner.os }}
      - if: steps.sdk.outputs.cache-hit != 'true'
        uses: ./.github/actions/linux-setup-vulkan
        with:
          path: ./vulkan_sdk
          version: ${{ env.VULKAN_SDK_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: vulkan-wave-build
          path: wave-build
          run-id: 35477466317
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: vulkan-wave-worker-3
          path: prior-worker-3
          run-id: 35477466317
          github-token: ${{ github.token }}
      - name: Verify preserved runtime and diagnose exactly 22 occurrences
        run: |
          set -euo pipefail
          sha256sum -c wave-build/SHA256SUMS
          mkdir build-vulkan
          tar -xzf wave-build/runtime.tar.gz -C build-vulkan
          # The SDK reads optional variables; restore strict mode immediately.
          set +u
          source ./vulkan_sdk/setup-env.sh
          set -u
          python3 - <<'PY_DIAGNOSTIC'
          import collections, importlib.util, json, re, subprocess
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('wave', 'scripts/ci-vulkan-coverage-wave.py')
          wave = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(wave)
          h = wave.helper
          out = Path('diagnostic-347'); out.mkdir()
          assert h.sha('wave-build/build.json') == '9feefd1cab42d112e12148ae9701bead32a6f5e57ae5ac5c1cea34b75feb8efb'
          assert h.sha('prior-worker-3/receipt.json') == 'cda2e4b18b937da8805e1753afcc5ae84387bc84ef5cfdde6df432f394f0429b'
          build = json.loads(Path('wave-build/build.json').read_text())
          assert build['source'] == h.SOURCE and build['head'] == '2f5a3564327b8e52213bba0cb7f0753564fccf9f'
          subprocess.run(['git', 'diff', '--exit-code', h.SOURCE, '--', '.',
              ':!.github/workflows/eliza-vulkan-validation.yml', ':!scripts/ci-vulkan-partitions.py',
              ':!scripts/ci-vulkan-pilot-witnesses.json', ':!scripts/ci-vulkan-coverage-wave.py',
              ':!scripts/ci-vulkan-wave-inputs.json'], check=True)
          for script in ['ci-vulkan-partitions.py', 'ci-vulkan-coverage-wave.py', 'ci-vulkan-wave-inputs.json']:
              assert Path('scripts', script).read_bytes() == subprocess.check_output(['git', 'show', build['head'] + ':scripts/' + script])
          binary = Path('build-vulkan/bin/test-backend-ops').resolve()
          for name, digest in build['payload_files'].items():
              assert Path(name).name == name and h.sha(binary.parent / name) == digest
          ldd, runtime = wave.libraries(binary)
          assert runtime == build['runtime_libraries']
          (out / 'ldd.txt').write_text(ldd)
          prior = json.loads(Path('prior-worker-3/receipt.json').read_text())['invocations'][-1]
          assert prior['selection']['id'] == 347 and prior['timed_out'] and prior['exit_code'] == 124
          for ext in ['stdout', 'stderr']:
              assert h.sha('prior-worker-3/partition-347.' + ext) == prior[ext + '_sha256']
          selection = build['partitions'][347]
          assert selection['lane'] == 'custom' and selection['operation'] == 'MUL_MAT' and selection['count'] == 22
          expected = collections.Counter(selection['expected'])
          target = 'type_a=iq4_xs,type_b=f32,m=16,n=5,k=256,bs=[1,1],nr=[1,1],per=[0,1,2,3],k_v=0,o=1'
          assert expected[target] == 1
          bins = [collections.Counter(), collections.Counter()]
          for param, count in sorted(expected.items(), key=lambda kv: (-kv[1], kv[0])):
              if param != target: min(bins, key=lambda c: sum(c.values()))[param] = count
          parts = [collections.Counter({target: 1})] + bins
          assert [sum(c.values()) for c in parts] == [1, 11, 10]
          assert sum(parts, collections.Counter()) == expected
          lines = h.ANSI.sub('', Path('prior-worker-3/partition-347.stdout').read_text()).splitlines()
          witnessed = {m.group(1) for line in lines if (m := re.fullmatch(r'  MUL_MAT\((.*)\): OK\s*', line))}
          assert len(witnessed) == 14
          receipt = {'source': h.SOURCE, 'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'build_sha256': h.sha('wave-build/build.json'), 'prior_run': 35477466317, 'original_partition': 347,
              'expected': dict(expected), 'complete_suite': False, 'invocations': []}
          h.write(out / 'receipt.json', receipt)
          covered = collections.Counter()
          for index, cases in enumerate(parts):
              label = ['isolated-n5', 'remaining-1', 'remaining-2'][index]
              chosen = dict(selection, label=label, expected=dict(cases), count=sum(cases.values()),
                            witnessed=sorted(set(cases) & witnessed))
              regex = '^(' + '|'.join(re.escape(p) for p in sorted(cases)) + ')$'
              invocation = h.run([str(binary), '-b', 'Vulkan0', '-o', 'MUL_MAT', '-p', regex], out / label, 300)
              invocation['selection'] = chosen
              invocation['accounting'] = h.verify((out / (label + '.stdout')).read_text(), 'MUL_MAT', cases,
                                                   chosen['witnessed'], allow_all_unsupported=True)
              invocation['valid'] = invocation['exit_code'] == 0 and not invocation['timed_out'] and invocation['accounting']['valid']
              receipt['invocations'].append(invocation)
              if invocation['valid']: covered.update(cases)
              h.write(out / 'receipt.json', receipt)
          receipt['terminal'] = True
          receipt['complete_partition'] = covered == expected and all(i['valid'] for i in receipt['invocations'])
          receipt['elapsed_seconds'] = sum(i['elapsed_seconds'] for i in receipt['invocations'])
          h.write(out / 'receipt.json', receipt)
          print(json.dumps({'complete_partition': receipt['complete_partition'], 'elapsed_seconds': receipt['elapsed_seconds']}))
          raise SystemExit(0 if receipt['complete_partition'] else 1)
          PY_DIAGNOSTIC
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-partition-347-diagnostic
          path: diagnostic-347
          retention-days: 14

  continuation-worker:
    permissions:
      contents: read
      actions: read
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.continuation_wave || inputs.final_wave) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.final_wave && 45 || 59 }}
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(inputs.final_wave && '[0]' || '[0, 1]') }}
    env:
      GGML_VK_VISIBLE_DEVICES: '0'
      GGML_VK_DISABLE_F16: '1'
      GGML_VK_DISABLE_COOPMAT: '1'
      VULKAN_SDK_VERSION: '1.4.357.1'
      FINAL_WAVE: ${{ inputs.final_wave }}
      BUILD_JSON: prior/vulkan-wave-build/build.json
      WORKER_ID: ${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 8
      - name: Require isolated continuation mode
        env:
          COVERAGE_WAVE: ${{ inputs.coverage_wave }}
          DIAGNOSTIC: ${{ inputs.diagnostic_347 }}
          PILOT: ${{ inputs.partition_pilot }}
          CONTINUATION: ${{ inputs.continuation_wave }}
        run: |
          test "$COVERAGE_WAVE" != true && test "$DIAGNOSTIC" != true && test "$PILOT" != true
          test "$FINAL_WAVE" != true || test "$CONTINUATION" != true
      - name: Install identical driver and loader prerequisites
        run: |
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update -y
          sudo apt-get install -y mesa-vulkan-drivers=26.2.3~kisak1~n vulkan-tools libvulkan-dev libssl-dev
      - uses: actions/cache@v5
        id: sdk
        with:
          path: ./vulkan_sdk
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-${{ runner.os }}
      - if: steps.sdk.outputs.cache-hit != 'true'
        uses: ./.github/actions/linux-setup-vulkan
        with:
          path: ./vulkan_sdk
          version: ${{ env.VULKAN_SDK_VERSION }}
      - name: Download pinned source-bound evidence and runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35477466317 -R elizaOS/llama.cpp -n vulkan-wave-build -n vulkan-wave-worker-0 -n vulkan-wave-worker-1 -n vulkan-wave-worker-2 -n vulkan-wave-worker-3 -D prior
          gh run download 35479874156 -R elizaOS/llama.cpp -n vulkan-partition-347-diagnostic -D prior/diagnostic
          if [ "$FINAL_WAVE" = true ]; then
            gh run download 35480212444 -R elizaOS/llama.cpp -n vulkan-continuation-worker-0 -n vulkan-continuation-worker-1 -D prior/continuation
          fi
      - name: Verify prior ledger and execute remaining bounded queue
        run: |
          set -euo pipefail
          ln -s prior/vulkan-wave-build wave-build
          sha256sum -c wave-build/SHA256SUMS
          mkdir build-vulkan
          tar -xzf prior/vulkan-wave-build/runtime.tar.gz -C build-vulkan
          set +u
          source ./vulkan_sdk/setup-env.sh
          set -u
          python3 - <<'PY_CONTINUATION'
          import collections, importlib.util, json, os, re, shutil, subprocess, time
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('wave', 'scripts/ci-vulkan-coverage-wave.py')
          wave = importlib.util.module_from_spec(spec); spec.loader.exec_module(wave); h = wave.helper
          build_path = Path(os.environ['BUILD_JSON'])
          assert h.sha(build_path) == '9feefd1cab42d112e12148ae9701bead32a6f5e57ae5ac5c1cea34b75feb8efb'
          build = json.loads(build_path.read_text())
          assert build['source'] == h.SOURCE and build['head'] == '2f5a3564327b8e52213bba0cb7f0753564fccf9f'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          subprocess.run(['git', 'diff', '--exit-code', h.SOURCE, '--', '.',
              ':!.github/workflows/eliza-vulkan-validation.yml', ':!scripts/ci-vulkan-partitions.py',
              ':!scripts/ci-vulkan-pilot-witnesses.json', ':!scripts/ci-vulkan-coverage-wave.py',
              ':!scripts/ci-vulkan-wave-inputs.json'], check=True)
          for script in ['ci-vulkan-partitions.py', 'ci-vulkan-coverage-wave.py', 'ci-vulkan-wave-inputs.json']:
