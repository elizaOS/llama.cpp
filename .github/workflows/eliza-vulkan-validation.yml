              assert [p['limit_seconds'] for p in remaining] == [600, 600, 300, 300, 300]
              planned = collections.Counter()
              for part in remaining: planned.update(wave.counter(part))
              prior_count = 7829
              assert len(remaining) == 5 and sum(planned.values()) == 93
              assert sum(covered.values()) == prior_count and covered + planned == original
          errors = []; new_ids = set(); found = set()
          for worker in range(workers):
              folder = Path('new/vulkan-continuation-worker-' + str(worker))
              path = folder / 'receipt.json'
              if not path.exists(): errors.append('missing worker ' + str(worker)); continue
              receipt = json.loads(path.read_text()); found.add(worker)
              assert receipt['head'] == head and receipt['source'] == h.SOURCE and receipt['worker'] == worker
              assert receipt['build_sha256'] == h.sha(build_path) and receipt['prior_covered_occurrences'] == prior_count
              assert receipt['worker_finished']
              assigned = remaining[worker::workers]
              assert receipt['assigned_ids'] == [p['id'] for p in assigned]
              allowed = {p['id'] for p in assigned}
