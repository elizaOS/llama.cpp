          import collections, importlib.util, json, os, re, shutil, subprocess, time
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('wave', 'scripts/ci-vulkan-coverage-wave.py')
          wave = importlib.util.module_from_spec(spec); spec.loader.exec_module(wave); h = wave.helper
          build_path = Path(os.environ['BUILD_JSON'])
          assert h.sha(build_path) == '9feefd1cab42d112e12148ae9701bead32a6f5e57ae5ac5c1cea34b75feb8efb'
          build = json.loads(build_path.read_text())
          assert build['source'] == h.SOURCE and build['head'] == '2f5a3564327b8e52213bba0cb7f0753564fccf9f'
