              ':!scripts/ci-vulkan-pilot-witnesses.json', ':!scripts/ci-vulkan-coverage-wave.py',
              ':!scripts/ci-vulkan-wave-inputs.json'], check=True)
          for script in ['ci-vulkan-partitions.py', 'ci-vulkan-coverage-wave.py', 'ci-vulkan-wave-inputs.json']:
              assert Path('scripts', script).read_bytes() == subprocess.check_output(['git', 'show', build['head'] + ':scripts/' + script])
          prior_hashes = ['a1c5fd8fc8e6b6aac28971349f51aa917c2925cc3f85a9cd5f3ccdcddbd9cd64',
              'd56a42f46d999eb25555b4a007f0455b6736091752e20ab7ca855528feabffae',
              '94b88a12417f5d09e58a53faad583f5c915eadd9b464e9dd9c119c2cccb89910',
              'cda2e4b18b937da8805e1753afcc5ae84387bc84ef5cfdde6df432f394f0429b']
          covered = collections.Counter({tuple(row[:3]): row[3] for row in build['completed']})
          original = collections.Counter({tuple(row[:3]): row[3] for row in build['original']})
          done = set()
          for worker, digest in enumerate(prior_hashes):
              folder = Path('prior/vulkan-wave-worker-' + str(worker))
              assert h.sha(folder / 'receipt.json') == digest
              receipt = json.loads((folder / 'receipt.json').read_text())
              assert receipt['worker_finished'] and receipt['head'] == build['head']
              for inv in receipt['invocations']:
                  if not inv['valid']:
                      assert inv['selection']['id'] == 347 and inv['timed_out'] and inv['exit_code'] == 124
                      continue
                  ident = inv['selection']['id']
                  assert ident not in done and all(inv['selection'][k] == v for k, v in build['partitions'][ident].items())
                  covered.update(wave.verify_invocation(inv, folder)); done.add(ident)
          folder = Path('prior/diagnostic')
          assert h.sha(folder / 'receipt.json') == 'f8d95e88c92bda45964296a36e236f9e188dbb391ba3174e2e114c523c23c3b2'
          diag = json.loads((folder / 'receipt.json').read_text())
          assert diag['terminal'] and diag['complete_partition'] and diag['source'] == h.SOURCE and 347 not in done
          split = collections.Counter()
          for inv in diag['invocations']: split.update(wave.verify_invocation(inv, folder))
          assert split == wave.counter(build['partitions'][347])
          covered.update(split); done.add(347)
